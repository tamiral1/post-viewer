<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Post Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one narrow column — input bar on top, embed below, recent links as a quiet list */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --fg: #1b1d26;
  --muted: #646a7c;
  --line: #dfe1e8;
  --accent: #3d4fd6;
  --accent-fg: #ffffff;
  --ig: #c13584;
  --fb: #1877f2;
  --err: #b42318;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12131a; --surface: #1b1d27; --fg: #e8e9f0; --muted: #9a9fb2;
    --line: #2c2f3d; --accent: #8593ff; --accent-fg: #10121c;
    --ig: #e46aae; --fb: #5ea2ff; --err: #ff8a7a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--body);
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
form { display: flex; gap: 8px; }
input[type=text] {
  flex: 1; min-width: 0; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px;
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
button {
  font: 600 14px var(--body); border: 0; border-radius: 10px; cursor: pointer;
  padding: 0 18px; background: var(--accent); color: var(--accent-fg);
}
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ghost { background: transparent; color: var(--muted); padding: 0 6px; font-weight: 500; }
.msg { margin: 0; font-size: 14px; color: var(--err); }
.stage { display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.tag { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: var(--surface); }
.tag.instagram { background: var(--ig); }
.tag.facebook { background: var(--fb); }
.meta a { color: var(--accent); }
.frame {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; display: flex; justify-content: center;
}
.frame iframe { border: 0; width: 100%; max-width: 540px; display: block; height: 760px; background: #fff; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.recent h2 { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.recent li button {
  width: 100%; text-align: left; background: transparent; color: var(--fg);
  padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: baseline; font-weight: 400;
}
.recent li button:hover { background: var(--surface); }
.recent .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.recent .url { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px 20px; color: var(--muted); font-size: 14px; }
.empty code { font: 12.5px var(--mono); color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Post Viewer</h1>
    <p class="sub">Paste a link you were sent to read the post here.</p>
  </header>

  <form id="f">
    <input id="u" type="text" inputmode="url" placeholder="Paste any IG or FB link" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <button type="submit">Open</button>
  </form>
  <p class="msg" id="msg" hidden></p>

  <section class="stage" id="stage" hidden>
    <div class="meta">
      <span class="tag" id="tag"></span>
      <button class="ghost" id="reload" type="button">Reload</button>
      <button class="ghost" id="clear" type="button">Clear</button>
    </div>
    <div class="frame"><iframe id="frame" title="Embedded post" allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe></div>
    <p class="hint" id="hint"></p>
  </section><style>[hidden]{display:none!important}</style>

  <div class="empty" id="empty">
    Works with IG and FB posts, reels, videos, photos, profiles and pages. Stories can’t be embedded, so those show the profile instead.
    Tip: paste anywhere on this page and it opens right away.
  </div>

  <section class="recent" id="recent" hidden>
    <h2>Recent</h2>
    <ul id="list"></ul>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'postviewer.recent';
const CUR = 'postviewer.current';

const IG_RESERVED = new Set(['explore','accounts','direct','stories','reels','reel','p','tv','share','tags',
  'locations','about','developer','legal','privacy','web','challenge','emails','nametag','session']);
const FB_NOT_PAGE = new Set(['watch','photo','photo.php','permalink.php','story.php','groups','events',
  'marketplace','share','gaming','hashtag','stories','reel','reels','video.php','login','login.php']);

function parse(raw, depth = 0) {
  if (depth > 4) return { error: 'That link redirects too many times.' };
  let s = (raw || '').trim();
  const found = s.match(/https?:\/\/[^\s<>"']+/i) || s.match(/\b(?:[\w-]+\.)?(?:instagram\.com|instagr\.am|facebook\.com|fb\.com|fb\.watch)\/[^\s<>"']*/i);
  if (found) s = found[0];
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  let u;
  try { u = new URL(s); } catch { return null; }
  const host = u.hostname.toLowerCase().replace(/^(www|m|web|l|lm|mbasic|touch|mobile|business)\./, '');

  // Outbound redirect wrappers (l.facebook.com/l.php?u=…, l.instagram.com/?u=…)
  const wrapped = u.searchParams.get('u');
  if (wrapped && (u.pathname === '/l.php' || /^l\./i.test(u.hostname))) return parse(wrapped, depth + 1);

  if (host === 'instagram.com' || host === 'instagr.am') {
    const parts = u.pathname.split('/').filter(Boolean);
    const next = u.searchParams.get('next');
    if (parts[0] === 'accounts' && next) {            // login-wall links keep the real target in ?next=
      return parse('https://www.instagram.com' + (next.startsWith('/') ? next : '/' + next), depth + 1);
    }
    const i = parts.findIndex(p => ['p', 'reel', 'reels', 'tv'].includes(p));
    if (i >= 0 && parts[i + 1]) {
      const kind = parts[i] === 'reels' ? 'reel' : parts[i];
      const clean = `https://www.instagram.com/${kind}/${parts[i + 1]}/`;
      const share = parts[0] === 'share';
      return { platform: 'instagram', clean, embed: clean + 'embed/captioned/', height: 760,
        note: share ? 'Share links often can’t be embedded. If it’s blank, ask the sender for the direct post link.'
          : kind === 'p' ? '' : 'Some reels only show the cover here. The play button can’t open IG from this page, by design.' };
    }
    if (parts[0] === 'share' && parts[1]) {            // /share/<id> with no kind
      const clean = `https://www.instagram.com/p/${parts[1]}/`;
      return { platform: 'instagram', clean, embed: clean + 'embed/captioned/', height: 760,
        note: 'Share links often can’t be embedded. If it’s blank, ask the sender for the direct post link.' };
    }
    if (parts[0] === 'stories' && parts[1] && parts[1] !== 'highlights') {
      const clean = `https://www.instagram.com/${parts[1]}/`;
      return { platform: 'instagram', clean, embed: clean + 'embed/', height: 760,
        note: 'Stories can’t be embedded, so this shows the profile instead.' };
    }
    if (parts[0] && !IG_RESERVED.has(parts[0].toLowerCase())) {
      const clean = `https://www.instagram.com/${parts[0]}/`;
      return { platform: 'instagram', clean, embed: clean + 'embed/', height: 760,
        note: 'Showing the profile. Open a specific post link to see just that post.' };
    }
    return { error: 'I couldn’t find a post, reel or profile in that IG link.' };
  }

  if (host === 'facebook.com' || host === 'fb.com' || host === 'fb.watch') {
    u.hash = '';
    if (host !== 'fb.watch') u.hostname = 'www.facebook.com';
    const keep = ['story_fbid', 'id', 'v', 'fbid', 'set', 'multi_permalinks', 'substory_index'];
    [...u.searchParams.keys()].forEach(k => { if (!keep.includes(k)) u.searchParams.delete(k); });
    const segs = u.pathname.split('/').filter(Boolean);
    if (host !== 'fb.watch' && !segs.length) return { error: 'I couldn’t find a post or page in that FB link.' };
    if (segs[0] === 'stories') return { error: 'FB stories can’t be embedded.' };
    const clean = u.toString();
    const enc = encodeURIComponent(clean);
    const isVideo = host === 'fb.watch' || /\/(videos|reel|reels|watch)\b/.test(u.pathname) || u.searchParams.has('v');
    const isPage = !isVideo && (segs[0] === 'pages' || (segs[0] === 'profile.php' && !u.searchParams.has('story_fbid'))
      || (segs.length === 1 && !FB_NOT_PAGE.has(segs[0])));
    if (isPage) {
      return { platform: 'facebook', clean, height: 700,
        embed: `https://www.facebook.com/plugins/page.php?href=${enc}&tabs=timeline&width=500&height=700&small_header=false&adapt_container_width=true`,
        note: 'Showing the page. Only public pages show up here.' };
    }
    const plugin = isVideo ? 'video.php' : 'post.php';
    const note = /\/share\//.test(u.pathname)
      ? 'Share links sometimes don’t embed. If it’s blank, ask the sender for the full post link (the one with /posts/ or /videos/).'
      : segs[0] === 'groups' ? 'Group posts usually don’t embed unless the group is public.' : '';
    return { platform: 'facebook', clean, height: isVideo ? 640 : 760, note,
      embed: `https://www.facebook.com/plugins/${plugin}?href=${enc}&show_text=true&width=500` };
  }
  return { error: 'Only IG and FB links are supported.' };
}

function loadRecent() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function saveRecent(list) { try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 12))); } catch {} }
function setCurrent(v) { try { v ? localStorage.setItem(CUR, v) : localStorage.removeItem(CUR); } catch {} }
function getCurrent() { try { return localStorage.getItem(CUR); } catch { return null; } }

function renderRecent() {
  const list = loadRecent();
  $('recent').hidden = !list.length;
  $('list').innerHTML = '';
  list.forEach(item => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="dot" style="background:var(--${item.platform === 'instagram' ? 'ig' : 'fb'})"></span><span class="url"></span>`;
    b.querySelector('.url').textContent = (item.platform === 'instagram' ? 'IG ' : 'FB ') + item.clean.replace(/^https:\/\/[^/]+/, '');
    b.addEventListener('click', () => { $('u').value = item.clean; show(item.clean); });
    li.appendChild(b); $('list').appendChild(li);
  });
}

function show(raw, opts = {}) {
  const r = parse(raw);
  $('msg').hidden = true;
  if (!r || r.error) {
    $('msg').textContent = r ? r.error : 'That doesn’t look like a link. Paste the full URL you were sent.';
    $('msg').hidden = false; return;
  }
  $('tag').textContent = r.platform === 'instagram' ? 'IG' : 'FB';
  $('tag').className = 'tag ' + r.platform;
  $('frame').style.height = r.height + 'px';
  $('frame').src = r.embed;
  $('hint').textContent = r.note || '';
  $('hint').hidden = !r.note;
  $('stage').hidden = false;
  $('empty').hidden = true;
  setCurrent(r.clean);                    // survives a refresh; nothing goes in the page address
  if (opts.restore) return;
  const list = loadRecent().filter(x => x.clean !== r.clean);
  list.unshift({ platform: r.platform, clean: r.clean });
  saveRecent(list); renderRecent();
}

// Links handed over by the redirect extension arrive base64-encoded in the hash.
// Read it, then wipe it from the address bar straight away.
function takeHash() {
  const h = location.hash.slice(1);
  if (!h) return null;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const b = h.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  } catch { return null; }
}
function openFromHash() {
  const url = takeHash();
  if (url) { $('u').value = url; show(url); return true; }
  return false;
}

$('f').addEventListener('submit', e => { e.preventDefault(); show($('u').value); });
$('reload').addEventListener('click', () => { const f = $('frame'); const s = f.src; f.src = 'about:blank'; setTimeout(() => { f.src = s; }, 50); });
$('clear').addEventListener('click', () => {
  $('frame').src = 'about:blank'; $('stage').hidden = true; $('empty').hidden = false;
  setCurrent(null); $('u').value = ''; $('u').focus();
});
document.addEventListener('paste', e => {
  if (e.target === $('u')) { setTimeout(() => show($('u').value), 0); return; }
  const t = (e.clipboardData || window.clipboardData).getData('text');
  if (t) { $('u').value = t.trim(); show(t); }
});
window.addEventListener('hashchange', openFromHash);

renderRecent();
if (!openFromHash()) {
  const last = getCurrent();
  if (last) { $('u').value = last; show(last, { restore: true }); }
}
</script>
</body>
</html>
